<body class="bg-background text-on-surface font-body-md antialiased min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background flex items-center justify-between px-margin-mobile h-16 w-full">
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed-dim">Home Hub</h1>
<button class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-24 pb-28 min-h-screen">
<!-- Week Navigation -->
<div class="flex items-center justify-between mb-lg px-margin-mobile">
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest shadow-[0_2px_8px_rgba(0,0,0,0.04)] text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div class="text-center flex-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">14 - 20 Octubre</h2>
<p class="font-label-sm text-label-sm text-primary uppercase tracking-widest mt-1">Esta Semana</p>
</div>
<button class="w-11 h-11 flex items-center justify-center rounded-full bg-surface-container-lowest shadow-[0_2px_8px_rgba(0,0,0,0.04)] text-on-surface hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Action Area -->
<div class="px-margin-mobile mb-xl">
<button class="w-full flex items-center justify-center gap-sm bg-primary text-on-primary py-4 px-md rounded-xl shadow-[0_4px_12px_rgba(21,66,18,0.2)] hover:bg-on-primary-fixed-variant transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<span class="font-label-md text-label-md">Generar lista de compra</span>
</button>
</div>
<!-- Days List -->
<div class="flex flex-col gap-xl">
<!-- Lunes -->
<section class="px-margin-mobile">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-sm flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-md text-label-md">14</span>
                    Lunes
                </h3>
<div class="flex flex-col gap-sm relative">
<!-- Comida (Assigned Recipe) -->
<div class="bg-surface-container-lowest p-md rounded-[16px] shadow-[0_4px_12px_0_rgba(0,0,0,0.04)] border border-outline-variant/30 flex items-start gap-md">
<div class="w-12 h-12 rounded-xl bg-secondary-container/20 flex flex-shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
</div>
<div class="flex-1 pt-1">
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Comida</h4>
<p class="font-body-lg text-body-lg text-on-surface font-medium leading-tight">Lentejas con chorizo</p>
<div class="mt-2 flex items-center gap-xs">
<span class="material-symbols-outlined text-outline text-[16px]">schedule</span>
<span class="font-label-sm text-label-sm text-outline">45 min</span>
</div>
</div>
<button class="p-2 -mr-2 -mt-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<!-- Cena (Free Text) -->
<div class="bg-surface-container-lowest p-md rounded-[16px] shadow-[0_4px_12px_0_rgba(0,0,0,0.04)] border border-outline-variant/30 flex items-start gap-md">
<div class="w-12 h-12 rounded-xl bg-tertiary-container/20 flex flex-shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">mode_night</span>
</div>
<div class="flex-1 pt-1">
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Cena</h4>
<div class="relative mt-1">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 p-0 pb-1 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:ring-0 focus:border-primary transition-colors focus:outline-none" type="text" value="Cena fuera (Pizzería)"/>
</div>
</div>
<button class="p-2 -mr-2 -mt-2 rounded-full text-primary hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined">add_circle</span>
</button>
</div>
</div>
</section>
<!-- Martes -->
<section class="px-margin-mobile">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-sm flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-label-md text-label-md">15</span>
                    Martes
                </h3>
<div class="flex flex-col gap-sm relative">
<!-- Comida (Empty State) -->
<div class="bg-surface-container-lowest p-md rounded-[16px] border border-dashed border-outline-variant flex items-center gap-md cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="w-12 h-12 rounded-xl bg-surface-variant flex flex-shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">wb_sunny</span>
</div>
<div class="flex-1">
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Comida</h4>
<p class="font-body-md text-body-md text-outline italic">Planificar comida...</p>
</div>
</div>
<!-- Cena (Assigned Recipe) -->
<div class="bg-surface-container-lowest p-md rounded-[16px] shadow-[0_4px_12px_0_rgba(0,0,0,0.04)] border border-outline-variant/30 flex items-start gap-md">
<div class="w-12 h-12 rounded-xl bg-tertiary-container/20 flex flex-shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">mode_night</span>
</div>
<div class="flex-1 pt-1">
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Cena</h4>
<p class="font-body-lg text-body-lg text-on-surface font-medium leading-tight">Tortilla de patatas</p>
<div class="mt-2 flex gap-xs flex-wrap">
<span class="inline-flex items-center gap-1 bg-surface-container px-2 py-1 rounded-full font-label-sm text-label-sm text-on-surface">
                                    Huevo
                                </span>
<span class="inline-flex items-center gap-1 bg-surface-container px-2 py-1 rounded-full font-label-sm text-label-sm text-on-surface">
                                    Patata
                                </span>
</div>
</div>
<button class="p-2 -mr-2 -mt-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</section>
</div>
</main>

<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest dark:bg-surface-container-low shadow-[0_-4px_12px_0_rgba(0,0,0,0.04)] flex justify-around items-center w-full px-4 py-2 pb-safe">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-all active:scale-90 duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="font-label-sm text-label-sm mt-1">Grocery</span>
</button>

<span class="font-label-sm text-label-sm mt-1 text-primary font-bold">Menu</span>
