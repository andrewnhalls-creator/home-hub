<!DOCTYPE html>

<meta charset="utf-8"/>

                        "outline": "#72796e",

                        "secondary-container": "#ff996e",

                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdcbd",
                        "inverse-surface": "#2b3234",

                        "outline-variant": "#c2c9bb",

                        "on-tertiary-container": "#ecb987",
                        "on-secondary-fixed": "#370e00",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#79300e",
                        "secondary-fixed": "#ffdbce",
                        "on-primary-container": "#9dd090",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#623f18",
                        "surface-bright": "#f4fafd",
                        "on-primary-fixed": "#002201",
                        "on-primary-fixed-variant": "#23501e",
                        "primary-fixed": "#bcf0ae",
                        "primary-container": "#2d5a27",
                        "primary": "#154212",

                    },
                    "borderRadius": {

                    "spacing": {

                    },
                    "fontFamily": {

                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* NumPad Animation */
        .numpad-btn {
            transition: all 0.15s ease;
        }
        .numpad-btn:active {
            transform: scale(0.95);
            background-color: var(--tw-colors-surface-container-highest);
        }
        
        /* Floating App Bar separation */
        .top-app-bar-glass {
            background-color: rgba(244, 250, 253, 0.9);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased h-screen overflow-hidden flex flex-col">
<!-- Top App Bar (Transactional variant - Simple back button) -->
<header class="top-app-bar-glass fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 w-full shadow-[0_4px_12px_0_rgba(0,0,0,0.02)]">
<button aria-label="Volver" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary text-[24px]">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary-fixed-dim">Finalizar compra</h1>
<div class="w-11 h-11"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas (Scrollable) -->
<main class="flex-1 mt-16 mb-[120px] overflow-y-auto px-margin-mobile pt-lg pb-xl flex flex-col items-center">
<!-- Context Card: Summary -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-2xl p-md border border-outline-variant/30 shadow-[0_4px_12px_0_rgba(0,0,0,0.04)] mb-xl">
<div class="flex items-center gap-sm mb-sm text-on-surface-variant font-label-md text-label-md uppercase">
<span class="material-symbols-outlined text-[18px]">shopping_bag</span>
<span>Resumen Mercadona</span>
</div>
<div class="flex justify-between items-end">
<div>
<p class="font-headline-md text-headline-md text-primary">24 <span class="font-body-md text-body-md text-on-surface-variant">artículos</span></p>
<p class="font-label-sm text-label-sm text-outline mt-1">Comprados hoy</p>
</div>
<div class="text-right">
<p class="font-headline-sm text-headline-sm text-tertiary">3 <span class="font-body-md text-body-md text-on-surface-variant">pendientes</span></p>
<div class="flex items-center justify-end gap-1 mt-1">
<span class="material-symbols-outlined text-error text-[16px] fill">warning</span>
<p class="font-label-sm text-label-sm text-error">Quedan en lista</p>
</div>
</div>
</div>
<!-- Progress bar -->
<div class="w-full bg-surface-container-high h-2 rounded-full mt-md overflow-hidden flex">
<div class="bg-primary h-full rounded-full" style="width: 88%;"></div>
</div>
</div>
<!-- Input Area -->
<div class="w-full max-w-md flex flex-col items-center flex-1">
<label class="font-label-md text-label-md text-on-surface-variant mb-xs text-center w-full">Gasto total del ticket</label>
<div class="relative w-full flex justify-center items-center py-md">
<div class="font-display-lg-mobile text-display-lg-mobile text-primary flex items-baseline gap-1" id="amount-display">
<span id="amount-value">0,00</span>
<span class="font-headline-md text-headline-md text-outline">€</span>
</div>
</div>
<!-- NumPad -->
<div class="grid grid-cols-3 gap-md w-full max-w-[320px] mt-lg mx-auto">
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('1')">1</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('2')">2</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('3')">3</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('4')">4</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('5')">5</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('6')">6</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('7')">7</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('8')">8</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('9')">9</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface-variant w-full h-[64px] rounded-2xl flex items-center justify-center" onclick="inputComma()">,</button>
<button class="numpad-btn font-headline-md text-headline-md text-on-surface bg-surface-container-lowest w-full h-[64px] rounded-2xl flex items-center justify-center shadow-[0_2px_8px_0_rgba(0,0,0,0.02)] border border-outline-variant/20" onclick="inputDigit('0')">0</button>
<button class="numpad-btn text-on-surface-variant w-full h-[64px] rounded-2xl flex items-center justify-center" onclick="deleteDigit()">
<span class="material-symbols-outlined text-[28px]">backspace</span>
</button>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest px-margin-mobile py-md pb-safe border-t border-surface-container-highest z-50">
<button class="w-full max-w-md mx-auto flex items-center justify-center gap-2 bg-primary text-on-primary font-headline-sm text-headline-sm h-14 rounded-full active:scale-[0.98] transition-transform shadow-[0_4px_12px_0_rgba(21,66,18,0.2)]">
<span class="material-symbols-outlined">check_circle</span>
            Confirmar y Guardar
        </button>
</div>
<script>
        let currentValue = "0";
        let hasComma = false;
        const display = document.getElementById('amount-value');

        function updateDisplay() {
            // Formatting logic to show European style (e.g., 1.234,56)
            let parts = currentValue.split(',');
            let integerPart = parts[0];
            
            // Format integer part with dots for thousands
            integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            
            if (parts.length > 1) {
                // Ensure max 2 decimals
                let decimalPart = parts[1].substring(0, 2);
                display.innerText = integerPart + ',' + decimalPart;
            } else {
                display.innerText = integerPart + (hasComma ? ',' : '');
            }
            
            // Visual feedback on input
            display.classList.add('scale-105');
            setTimeout(() => display.classList.remove('scale-105'), 100);
            
            // Update color if > 0
            if(parseFloat(currentValue.replace(',','.')) > 0) {
                 display.parentElement.classList.remove('text-outline');
                 display.parentElement.classList.add('text-primary');
            } else {
                 display.parentElement.classList.add('text-outline');
                 display.parentElement.classList.remove('text-primary');
            }
        }

        function inputDigit(digit) {
            if (currentValue === "0" && digit !== "0") {
                currentValue = digit;
            } else if (currentValue !== "0" || hasComma) {
                // Limit total length to prevent overflow
                if(currentValue.length < 9) {
                     // If has comma, limit to 2 decimals
                    if(hasComma) {
                        let parts = currentValue.split(',');
                        if(parts[1] && parts[1].length >= 2) return;
                    }
                    currentValue += digit;
                }
            }
            updateDisplay();
        }

        function inputComma() {
            if (!hasComma) {
                currentValue += ',';
                hasComma = true;
                updateDisplay();
            }
        }

        function deleteDigit() {
            if (currentValue.length > 1) {
                if (currentValue.slice(-1) === ',') {
                    hasComma = false;
                }
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = "0";
                hasComma = false;
            }
            updateDisplay();
        }
        
        // Init visual state
        display.parentElement.classList.add('text-outline');
        display.parentElement.classList.remove('text-primary');
        display.style.transition = "transform 0.1s ease";
    </script>
</body></html>
