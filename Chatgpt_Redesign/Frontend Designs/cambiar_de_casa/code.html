<script>
        // Simple interactions for demonstration
        function closeSheet() {
            document.getElementById('bottom-sheet').style.transform = 'translateY(100%)';
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                // In a real app, this would remove the elements or navigate
                document.getElementById('bottom-sheet').style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
                
                // Remove blur from background
                document.querySelector('.z-0').classList.remove('blur-sm', 'opacity-50', 'pointer-events-none');
            }, 300);
        }

        // Add touch drag logic for bottom sheet (basic implementation)
        const sheet = document.getElementById('bottom-sheet');
        let startY;
        let currentY;
        
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        sheet.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            
            // Only allow dragging down
            if (deltaY > 0) {
                sheet.style.transform = `translateY(${deltaY}px)`;
                sheet.style.transition = 'none';
            }
        }, { passive: true });

        sheet.addEventListener('touchend', (e) => {
            sheet.style.transition = 'transform 300ms ease-out';
            const deltaY = currentY - startY;
            
            if (deltaY > 100) { // Threshold to close
                closeSheet();
            } else { // Snap back
                sheet.style.transform = 'translateY(0)';
            }
        });
    </script>
