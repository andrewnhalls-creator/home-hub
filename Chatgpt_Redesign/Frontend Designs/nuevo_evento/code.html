<input class="w-full px-4 py-3 text-body-lg font-body-lg text-on-surface placeholder:text-outline transition-colors" id="titulo" placeholder="Ej. Cena con abuelos, Pagar recibo luz..." required="" type="text"/>
</div>
<!-- Grid: Fecha y Hora (Inicio y Fin) -->

<!-- Inicio -->
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface-variant">Empieza</label>
<div class="flex gap-sm">
<div class="relative w-full">

<input class="w-full pl-10 pr-3 py-3 text-body-md font-body-md text-on-surface" id="fecha-inicio" required="" type="date"/>
</div>
<div class="relative w-32 flex-shrink-0">

                </button>

</main>
<script>
        // Simple logic to ensure end date is not before start date (UI enhancement)
        const startDateInput = document.getElementById('fecha-inicio');
        const endDateInput = document.getElementById('fecha-fin');

        startDateInput.addEventListener('change', (e) => {
            if(endDateInput.value === '' || endDateInput.value < e.target.value) {
                endDateInput.value = e.target.value;
            }
            endDateInput.min = e.target.value;
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            // In a real app, this would submit the data
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Guardando...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span> ¡Guardado!';
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-[#a1d494]', 'text-[#002201]'); // inverse-primary / on-primary-fixed
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.add('bg-primary');
                    btn.classList.remove('bg-[#a1d494]', 'text-[#002201]', 'opacity-80', 'cursor-not-allowed');
                }, 2000);
            }, 800);
        });
    </script>
