<body class="bg-background text-on-background min-h-screen flex justify-center w-full">
<!-- Transactional Screen: Navigation Shell Suppressed -->
<div class="w-full max-w-md bg-surface-container-lowest h-screen flex flex-col shadow-xl">
<!-- TopAppBar (Modified for Transactional Context) -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-50 bg-surface-container-lowest text-primary">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-variant/50 active:scale-95 duration-200 transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Nuevo Gasto</h1>
<div class="w-11"></div> <!-- Spacer -->
</header>
<main class="flex-1 overflow-y-auto px-margin-mobile pb-xl">
<!-- Amount Input -->
<div class="flex flex-col items-center justify-center py-xl mt-4">
<div class="text-on-surface-variant font-label-md text-label-md mb-2">Importe</div>
<div class="flex items-center text-primary border-b-2 border-primary/20 focus-within:border-primary transition-colors pb-2 px-4 w-3/4 max-w-[250px]">
<span class="font-display-lg text-display-lg mr-2">€</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-display-lg text-display-lg text-center p-0 placeholder-primary/30" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Form -->
<div class="space-y-lg mt-md">
<!-- Description -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs ml-2">Descripción</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="edit">edit</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-xl border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-all" id="desc-input" placeholder="Ej. Mercadona" type="text"/>
</div>
<!-- Smart Suggestion (Hidden by default, shown via JS simulation) -->
<div class="hidden absolute -bottom-10 left-0 bg-primary-container text-on-primary-container rounded-full px-4 py-2 font-label-md text-label-md flex items-center gap-2 shadow-sm border border-primary-container z-10 cursor-pointer hover:bg-primary-container/80 transition-colors" id="smart-chip">
<span class="material-symbols-outlined text-[18px]" data-icon="auto_awesome">auto_awesome</span>
                        ¿Categoría: Supermercado?
                    </div>
</div>
<!-- Date & Category Row -->
<div class="grid grid-cols-2 gap-gutter">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs ml-2">Fecha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface rounded-xl border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface" type="date"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs ml-2">Categoría</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="category">category</span>
<select class="w-full h-14 pl-12 pr-10 bg-surface rounded-xl border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md appearance-none text-on-surface">
<option disabled="" selected="" value="">Seleccionar</option>
<option value="super">Supermercado</option>
<option value="home">Hogar</option>
<option value="utils">Servicios</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Payer (Quién pagó) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-sm ml-2">¿Quién pagó?</label>
<div class="flex gap-sm overflow-x-auto pb-2 scrollbar-hide">
<!-- Chip 1: Selected -->
<button class="flex-shrink-0 flex items-center gap-2 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full border border-secondary-container font-label-md text-label-md transition-colors">
<img class="w-6 h-6 rounded-full object-cover" data-alt="A small, soft-lit avatar portrait of a mature Spanish woman with a warm expression, minimalist background. 50-100 words." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPIIuiMhfUr-HqxriQ2my96t_Hycz7gULHq19w6FAeIDje533b4x3hXV4b0JWmA5wDtqE02kRB6UQwBl7NPlZB5dOmDFTj7nCyzi4grkcAjGDZiyqM1IJRsdGhQJAlo4bQWGAT2L1Z48SM1RjqoK2MB_tO8v7LzuuEJRbFYP6d9-sFk6HTjbWcjTHZzde7S4IGJkL7uMrqVozlai-E6UKaCZh4k3pyTCe-Kfh9QFqh2PVWhQlvq9Hk"/>
                            Mamá
                        </button>
<!-- Chip 2: Unselected -->
<button class="flex-shrink-0 flex items-center gap-2 bg-surface text-on-surface px-4 py-2 rounded-full border border-outline-variant font-label-md text-label-md hover:bg-surface-variant/30 transition-colors">
<img class="w-6 h-6 rounded-full object-cover" data-alt="A small, soft-lit avatar portrait of a middle-aged Spanish man with a slight smile, minimalist background. 50-100 words." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAaWBqMy7_cSN_M3ipGh6zWUAUPgZMDX_WtCxd_JOZ3Q9lGqUPlcHuUBlNIde-B0Y41Y8bmo9OLkuwbLmb6VWx8gR82r9847CTuQijzl2FJvq8SbV5YuEotznGUl7E9xFgtqeQGzg5s702gKHVVpvoxrFzLbxBgk6O83Ghui2go3KxsS8C5N-8F-64HCMAPq49TZNb98ouyJH1f4kq5VCD9HCL7ILKcKOc5-kKzsfu1atl36YN7D6I6"/>
                            Papá
                        </button>
<!-- Chip 3: Unselected -->
<button class="flex-shrink-0 flex items-center gap-2 bg-surface text-on-surface px-4 py-2 rounded-full border border-outline-variant font-label-md text-label-md hover:bg-surface-variant/30 transition-colors">
<div class="w-6 h-6 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center text-[10px] font-bold">E</div>
                            Elena
                        </button>
</div>
</div>
<!-- Account / Tag -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs ml-2">Cuenta / Etiqueta</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="account_balance_wallet">account_balance_wallet</span>
<select class="w-full h-14 pl-12 pr-10 bg-surface rounded-xl border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md appearance-none text-on-surface">
<option>Cuenta Conjunta</option>
<option>Efectivo</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</main>
<!-- Actions Footer -->
<footer class="p-margin-mobile border-t border-surface-variant bg-surface-container-lowest">
<div class="flex flex-col gap-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="check">check</span>
                    Guardar Gasto
                </button>
<button class="w-full h-12 bg-transparent text-secondary rounded-xl font-label-md text-label-md flex items-center justify-center border border-secondary/20 hover:bg-secondary/5 active:scale-[0.98] transition-all">
                    Cancelar
                </button>
</div>
</footer>
</div>
<script>
        // Simple micro-interaction for the smart chip suggestion
        const descInput = document.getElementById('desc-input');
        const smartChip = document.getElementById('smart-chip');

        descInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if (val.includes('mercadona') || val.includes('super')) {
                smartChip.classList.remove('hidden');
                // subtle animation
                smartChip.animate([
                    { opacity: 0, transform: 'translateY(-10px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], { duration: 300, fill: 'forwards', easing: 'ease-out' });
            } else {
                smartChip.classList.add('hidden');
            }
        });

        smartChip.addEventListener('click', () => {
            // Select the category automatically in a real app
            smartChip.classList.add('hidden');
            const categorySelect = document.querySelector('select');
            categorySelect.value = 'super';
            
            // Visual feedback
            categorySelect.classList.add('ring-2', 'ring-primary-container');
            setTimeout(() => {
                categorySelect.classList.remove('ring-2', 'ring-primary-container');
            }, 500);
        });
    </script>
</body></html>
